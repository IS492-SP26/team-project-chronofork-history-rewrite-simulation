      type: "ending",
      tag: "Alternative Ending · Diverges from History",
      tagClass: "",
      title: "Signed in Public · Torn Apart Afterward",
      castOnStage: ["尼基塔·赫鲁晓夫", "约翰·F·肯尼迪"],
      narrative: [
        "Squeezed between Castro and domestic hardliners, Khrushchev demands a public written U.S. commitment to remove the Turkish missiles; otherwise he will not remove the Cuban missiles. Kennedy, facing domestic political pressure, is unwilling to 'lose face' so openly — both sides sink into two weeks of very public recriminations.",
        "An agreement is eventually reached through Dobrynin's efforts, but the public U.S. withdrawal from Turkey triggers a bipartisan domestic debate about 'appeasement diplomacy.' Kennedy narrowly escapes defeat in the 1964 election. Turkey and Greece feel betrayed and drift from the U.S. for years. Khrushchev is toppled by Brezhnev in 1964 on charges of 'adventurism.' All three parties lose something; virtually no one emerges a winner."
      ],
      reflection: "<b>Counterfactual reasoning:</b> 'Face' and 'substance' are often substitutes for the same resource — when one side insists on turning a 'secret deal' into a 'public victory,' the fruit of that victory tends to rot in the process. This branch reveals that <b>the wisdom of diplomacy often lies in the restraint of 'letting the other side take the face while you take the substance.'</b>"
    }
  };

  /* ============================================================
     Story progress labels
     ============================================================ */
  const STORY_PROGRESS_LABELS_EN = [
    "Missiles Spotted Over the Caribbean",
    "The Naval Quarantine and the Public Showdown",
    "The ExComm's Deliberations and Back-Channel Maneuvering",
    "The Kremlin's Final Decision",
    "The Aftermath and the Thaw in the Cold War"
  ];

  const state = {
    pathTrace: []
  };

  function renderCast(names) {
    const list = document.getElementById("cast-list");
    const cast = getCast();
    list.innerHTML = "";
    (names || []).forEach(key => {
      const c = cast[key];
      if (!c) return;
      const row = document.createElement("div");
      row.className = "cast-row";
      row.innerHTML = `
        <div class="av">${c.avatar}</div>
        <div class="info">
          <div class="name">${currentLang === 'en' ? c.name : key}</div>
          <div class="role">${c.title}</div>
          <div class="desc">${c.desc}</div>
        </div>`;
      list.appendChild(row);
    });
  }

  function renderProgress(currentIndex) {
    const list = document.getElementById("progress-list");
    const labels = getLabels();
    list.innerHTML = "";
    labels.forEach((label, i) => {
      const row = document.createElement("div");
      let cls = "step";
      if (currentIndex != null) {
        if (i < currentIndex) cls += " done";
        else if (i === currentIndex) cls += " current";
      }
      row.className = cls;
      row.innerHTML = `<span class="dot">●</span><span>${i + 1}. ${label}</span>`;
      list.appendChild(row);
    });
    const meta = document.getElementById("meta-progress");
    if (meta) {
      const display = currentIndex == null ? 0 : Math.min(currentIndex + 1, labels.length);
      meta.textContent = currentLang === 'en'
        ? `Act ${display} / ${labels.length}`
        : `第 ${display} / ${labels.length} 幕`;
    }
  }

  function go(passageId, choiceIndex) {
    if (choiceIndex != null) {
      const last = state.pathTrace[state.pathTrace.length - 1];
      if (last && last.choiceIndex == null) last.choiceIndex = choiceIndex;
    }
    render(passageId);
  }

  function render(passageId) {
    currentPassageId = passageId;
    const passages = getPassages();
    const p = passages[passageId];
    if (!p) return;

    const area = document.getElementById("passage-area");
    area.innerHTML = "";

    const card = document.createElement("section");
    card.className = "stage fade-in" + (p.type === "ending" ? " ending" : "") + (p.type === "start" ? " start" : "");

    if (p.type === "start") {
      const startLabel = currentLang === 'en' ? 'Begin this story →' : '开始这段历史 →';
      card.innerHTML = `
        <div class="stage-body">
          <div class="ep-emoji">${p.epEmoji}</div>
          <div class="ep-title">${p.epTitle}</div>
          <div class="ep-sub">${p.epSub}</div>
          <p class="ep-desc">${p.desc}</p>
          <button class="start-btn" id="start-btn">${startLabel}</button>
        </div>`;
      area.appendChild(card);
      renderCast(["约翰·F·肯尼迪", "尼基塔·赫鲁晓夫", "菲德尔·卡斯特罗", "罗伯特·F·肯尼迪", "阿纳托利·多布雷宁"]);
      renderProgress(null);
      document.getElementById("start-btn").onclick = () => {
        state.pathTrace = [];
        render(p.next);
      };
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (p.type === "scene") {
      state.pathTrace.push({ passageId: passageId, choiceIndex: null });

      const headHtml = `
        <div class="stage-head">
          <div>
            <div class="chapter">${p.chapter}</div>
            <div class="scene-title">${p.sceneTitle}</div>
          </div>
          <div class="right-tag">SCENE  ${String(p.progressIndex + 1).padStart(2, "0")}</div>
        </div>`;

      let bodyHtml = `<div class="stage-body">`;
      p.narrative.forEach((para, i) => {
        bodyHtml += `<p class="narrative${i === 0 ? " lead" : ""}">${para}</p>`;
      });

      if (p.dialogs && p.dialogs.length) {
        bodyHtml += `<div class="dialogs">`;
        p.dialogs.forEach(d => {
          if (d.direction) {
            bodyHtml += `<div class="stage-direction">— ${d.direction} —</div>`;
          } else {
            const av = (CAST[d.who] && CAST[d.who].avatar) || "·";
            const speakerName = currentLang === 'en' ? (CAST_EN[d.who] ? CAST_EN[d.who].name : d.who) : d.who;
            bodyHtml += `<div class="line">
              <div class="who"><span class="av">${av}</span>${speakerName}</div>
              <div class="what">${d.what}</div>
            </div>`;
          }
        });
        bodyHtml += `</div>`;
      }

      if (p.decision) {
        const makerAv = (CAST[p.decision.maker] && CAST[p.decision.maker].avatar) || "·";
        const makerName = currentLang === 'en' ? (CAST_EN[p.decision.maker] ? CAST_EN[p.decision.maker].name : p.decision.maker) : p.decision.maker;
        const decLabel = currentLang === 'en' ? '▼ KEY DECISION' : '▼ 关键抉择 KEY DECISION';
        const makerLabel = currentLang === 'en'
          ? `Decision by ${makerAv} <b>${makerName}</b>`
          : `由 ${makerAv} <b>${makerName}</b> 拍板`;
        bodyHtml += `
          <div class="decision">
            <div class="label">${decLabel}</div>
            <div class="question">${p.decision.question}</div>
            <div class="maker">${makerLabel}</div>
          </div>`;
      }

      if (p.choices && p.choices.length) {
        bodyHtml += `<div class="choices">`;
        p.choices.forEach((c, i) => {
          bodyHtml += `<button class="choice-btn" data-next="${c.next}" data-index="${i}">
            <span class="arrow">▶</span>${c.label}
            ${c.hint ? `<span class="hint">${c.hint}</span>` : ""}
          </button>`;
        });
        bodyHtml += `</div>`;
      }

      bodyHtml += `</div>`;
      card.innerHTML = headHtml + bodyHtml;
      area.appendChild(card);

      renderCast(p.castOnStage);
      renderProgress(p.progressIndex);

      card.querySelectorAll(".choice-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("data-next");
          const idx = parseInt(btn.getAttribute("data-index"), 10);
          go(next, idx);
        });
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (p.type === "ending") {
      const endChapter = currentLang === 'en' ? 'END  ·  THE END' : '终  ·  THE END';
      const headHtml = `
        <div class="stage-head">
          <div>
            <div class="chapter">${endChapter}</div>
            <div class="scene-title">${p.title}</div>
          </div>
          <div class="right-tag">EPISODE COMPLETE</div>
        </div>`;

      let bodyHtml = `<div class="stage-body">
        <div class="ending-tag ${p.tagClass || ""}">${p.tag}</div>
        <div class="ending-title">${p.title}</div>`;

      p.narrative.forEach((para, i) => {
        bodyHtml += `<p class="narrative${i === 0 ? " lead" : ""}">${para}</p>`;
      });

      bodyHtml += `<div class="reflection">${p.reflection}</div>`;

      if (state.pathTrace.length) {
        const ptTitle = currentLang === 'en' ? '▼ YOUR STORY PATH' : '▼ 你走过的剧情线 STORY PATH';
        const endLabel = currentLang === 'en' ? 'Ending reached:' : '抵达结局：';
        bodyHtml += `<div class="path-trace">
          <div class="pt-title">${ptTitle}</div>
          <ol>`;
        state.pathTrace.forEach(t => {
          const tp = passages[t.passageId];
          const sceneName = tp ? tp.sceneTitle : t.passageId;
          let choiceStr = '';
          if (t.choiceIndex != null && tp && tp.choices && tp.choices[t.choiceIndex]) {
            choiceStr = ` — <i style="color:var(--accent-2)">${tp.choices[t.choiceIndex].label}</i>`;
          }
          bodyHtml += `<li>${sceneName}${choiceStr}</li>`;
        });
        bodyHtml += `<li>${endLabel} <b style="color:var(--accent-2)">${p.title}</b></li>`;
        bodyHtml += `</ol></div>`;
      }

      const restartLabel = currentLang === 'en' ? '↺  Restart' : '↺  重新开始（Restart）';
      bodyHtml += `<div class="actions">
        <button id="restart-btn">${restartLabel}</button>
      </div>`;

      bodyHtml += `</div>`;
      card.innerHTML = headHtml + bodyHtml;
      area.appendChild(card);

      renderCast(p.castOnStage);
      renderProgress(getLabels().length - 1);

      document.getElementById("restart-btn").addEventListener("click", () => {
        state.pathTrace = [];
        render("start");
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
  }

  // boot
  updateStaticUI();
  render("start");
</script>
</body>
</html>
