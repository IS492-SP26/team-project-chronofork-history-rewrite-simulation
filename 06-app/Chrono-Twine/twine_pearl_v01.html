<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Attack on Pearl Harbor · Twine IDN Baseline</title>
<style>
  :root { --bg-0: #14110d; --bg-1: #1a1612; --bg-2: #221c16; --bg-card: #26201a; --ink-0: #f0e7d8; --ink-1: #d2c4a9; --ink-2: #978769; --ink-3: #6a5e44; --accent: #c0392b; --accent-2: #e8c14a; --accent-3: #5d8a4e; --rule: #3f3424; --shadow: 0 6px 24px rgba(0, 0, 0, 0.55); --serif: "Georgia", "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; --sans: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans SC", -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--ink-0); font-family: var(--serif); line-height: 1.7; min-height: 100vh; }
  body { background: radial-gradient(circle at 20% 0%, rgba(192, 57, 43, 0.1), transparent 40%), radial-gradient(circle at 80% 100%, rgba(232, 193, 74, 0.05), transparent 50%), var(--bg-0); }

  header.episode { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; background: linear-gradient(135deg, var(--bg-2), var(--bg-1)); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .episode .title-block { display: flex; align-items: center; gap: 14px; }

  .episode .title { font-size: 22px; font-weight: 700; color: var(--accent-2); letter-spacing: 1px; }
  .episode .sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; letter-spacing: 2px; font-family: var(--sans); }
  .episode .meta { text-align: right; font-size: 12px; color: var(--ink-2); font-family: var(--sans); }
  .episode .meta .tag { display: inline-block; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 3px; margin-left: 6px; color: var(--ink-1); }

  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } aside.side { order: 2; } }
  .stage { background: var(--bg-card); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
  .stage-head { padding: 14px 22px; border-bottom: 1px solid var(--rule); background: linear-gradient(180deg, rgba(192, 57, 43, 0.1), transparent); display: flex; align-items: center; justify-content: space-between; }
  .stage-head .chapter { color: var(--accent-2); font-size: 13px; letter-spacing: 4px; font-family: var(--sans); }
  .stage-head .scene-title { font-size: 20px; font-weight: 600; color: var(--ink-0); margin-top: 2px; }
  .stage-head .right-tag { font-size: 12px; color: var(--ink-2); font-family: var(--sans); }
  .stage-body { padding: 22px 26px; }
  .narrative { font-size: 16px; color: var(--ink-1); text-indent: 2em; margin: 0 0 16px; }
  .narrative.lead { color: var(--ink-0); font-size: 16.5px; }
  .dialogs { margin: 18px 0 6px; padding: 14px 16px; background: rgba(0, 0, 0, 0.22); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
  .dialogs .line { display: flex; gap: 10px; margin: 8px 0; align-items: baseline; }
  .dialogs .who { flex: 0 0 110px; text-align: right; color: var(--accent-2); font-weight: 600; font-size: 14px; font-family: var(--sans); }
  .dialogs .who .av { margin-right: 4px; }
  .dialogs .what { flex: 1; color: var(--ink-1); font-size: 15px; line-height: 1.65; }
  .dialogs .what::before { content: "「"; color: var(--ink-3); }
  .dialogs .what::after { content: "」"; color: var(--ink-3); }
  .decision { margin-top: 22px; padding: 16px 18px; border: 1px dashed var(--accent-2); border-radius: 6px; background: rgba(232, 193, 74, 0.04); }
  .decision .label { font-size: 12px; letter-spacing: 3px; color: var(--accent-2); font-family: var(--sans); margin-bottom: 6px; }
  .decision .question { font-size: 16px; color: var(--ink-0); font-weight: 600; margin-bottom: 4px; }

  .choices { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { display: block; width: 100%; text-align: left; background: var(--bg-2); color: var(--ink-0); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 16px; font-family: var(--serif); font-size: 15px; line-height: 1.55; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.05s; }
  .choice-btn:hover { background: #2f281f; border-color: var(--accent-2); color: var(--accent-2); }
  .choice-btn:active { transform: translateY(1px); }
  .choice-btn .arrow { color: var(--accent); margin-right: 8px; font-weight: 700; }
  .choice-btn .hint { display: block; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); font-family: var(--sans); }
  aside.side { display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--bg-card); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; box-shadow: var(--shadow); }

  .cast-list .cast-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--rule); }
  .cast-list .cast-row:last-child { border-bottom: none; }
  .cast-list .av { font-size: 22px; flex: 0 0 28px; text-align: center; }
  .cast-list .info .name { font-weight: 600; color: var(--ink-0); font-size: 14px; }
  .cast-list .info .role { font-size: 11.5px; color: var(--ink-2); font-family: var(--sans); }
  .cast-list .info .desc { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.45; }
  .progress-list .step { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px; font-family: var(--sans); color: var(--ink-3); }
  .progress-list .step .dot { flex: 0 0 12px; color: var(--rule); font-size: 11px; }
  .progress-list .step.done { color: var(--ink-1); } .progress-list .step.done .dot { color: var(--accent-3); }
  .progress-list .step.current { color: var(--accent-2); font-weight: 600; } .progress-list .step.current .dot { color: var(--accent); }
  .ending .stage-head { background: linear-gradient(180deg, rgba(192, 57, 43, 0.18), transparent); }
  .ending .ending-tag { display: inline-block; padding: 4px 12px; background: var(--accent); color: var(--ink-0); font-size: 12px; letter-spacing: 3px; border-radius: 3px; font-family: var(--sans); margin-bottom: 10px; }
  .ending .ending-tag.canonical { background: var(--accent-3); }
  .ending .ending-title { font-size: 26px; font-weight: 700; color: var(--accent-2); margin: 4px 0 14px; }
  .ending .reflection { margin-top: 18px; padding: 14px 16px; background: rgba(0, 0, 0, 0.22); border-left: 3px solid var(--accent-2); border-radius: 0 6px 6px 0; font-size: 14.5px; color: var(--ink-1); font-family: var(--sans); line-height: 1.7; }
  .ending .reflection b { color: var(--accent-2); }
  .ending .path-trace { margin-top: 16px; padding: 12px 14px; background: rgba(0, 0, 0, 0.18); border: 1px solid var(--rule); border-radius: 6px; font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
  .ending .path-trace .pt-title { color: var(--accent-2); font-weight: 600; margin-bottom: 6px; font-size: 12px; letter-spacing: 2px; }
  .ending .path-trace ol { margin: 0; padding-left: 20px; } .ending .path-trace ol li { margin: 3px 0; color: var(--ink-1); }
  .ending .actions { margin-top: 22px; display: flex; gap: 10px; }
  .ending .actions button { flex: 1; padding: 12px 16px; background: var(--bg-2); border: 1px solid var(--rule); border-radius: 6px; color: var(--ink-0); font-family: var(--serif); font-size: 15px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .ending .actions button:hover { background: #2f281f; border-color: var(--accent-2); color: var(--accent-2); }
  .start .stage-body { text-align: center; padding: 44px 36px; }
  .start .ep-emoji { font-size: 68px; margin-bottom: 8px; }
  .start .ep-title { font-size: 32px; font-weight: 700; color: var(--accent-2); letter-spacing: 4px; margin-bottom: 6px; }
  .start .ep-sub { font-size: 13px; color: var(--ink-2); letter-spacing: 6px; font-family: var(--sans); margin-bottom: 22px; }
  .start .ep-desc { text-align: left; color: var(--ink-1); font-size: 15.5px; text-indent: 2em; line-height: 1.85; margin: 0 auto 20px; max-width: 640px; }
  .start .start-btn { display: inline-block; margin-top: 14px; padding: 14px 36px; background: var(--accent); color: var(--ink-0); border: none; border-radius: 6px; font-family: var(--serif); font-size: 16px; letter-spacing: 4px; cursor: pointer; transition: background 0.15s, transform 0.05s; }
  .start .start-btn:hover { background: #d44a3a; } .start .start-btn:active { transform: translateY(1px); }
  footer.foot { margin-top: 26px; text-align: center; color: var(--ink-3); font-size: 12px; letter-spacing: 2px; font-family: var(--sans); }
  footer.foot .pipe { margin: 0 8px; }
  .fade-in { animation: fadeIn 0.35s ease; } @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: var(--bg-1); } ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  /* ---------- Back to home ---------- */
  .back-home {
    position: fixed;
    top: 14px;
    left: 14px;

    background: var(--accent);
    color: #ffffff;

  }

  /* ---------- Lang toggle ---------- */
  .lang-toggle {

    background: var(--accent-2);
    color: #1a120b;
    border-color: var(--accent-2);
  }

</style>

<a class="back-home" id="back-home-link" href="index.html">← Home</a>
<button class="lang-toggle" id="lang-toggle" onclick="toggleLang()">中文</button>

<div class="app">
  <header class="episode">
    <div class="title-block">
      <div class="emoji">🌊</div>
      <div>
        <div class="title" id="ep-title-el">Attack on Pearl Harbor</div>
        <div class="sub">PEARL HARBOR · DEC 7, 1941 · OAHU · HAWAII</div>
      </div>

    </aside>
  </div>
  <footer class="foot">Twine IDN Baseline · Static Branching Narrative <span class="pipe">|</span> Episode 06 — <span id="foot-ep-name">珍珠港事件</span> <span class="pipe">|</span> v1.0</footer>
</div>
<script>
  /* ============================================================
     Language support
     ============================================================ */
  let currentLang = localStorage.getItem('lang') || 'en';
  let currentPassageId = 'start';

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'zh' : 'en';
    localStorage.setItem('lang', currentLang);
    updateStaticUI();
    render(currentPassageId);
  }

  function getPassages() { return currentLang === 'en' ? PASSAGES_EN : PASSAGES; }
  function getCast()     { return currentLang === 'en' ? CAST_EN     : CAST;     }
  function getLabels()   { return currentLang === 'en' ? STORY_PROGRESS_LABELS_EN : STORY_PROGRESS_LABELS; }

  function updateStaticUI() {
    const isEn = currentLang === 'en';
    document.title = isEn ? 'Attack on Pearl Harbor · Twine IDN Baseline' : '珍珠港偷袭 · Twine IDN Baseline';
    document.getElementById('ep-title-el').textContent   = isEn ? 'Attack on Pearl Harbor' : '珍珠港偷袭';
    document.getElementById('cast-panel-h').textContent  = isEn ? 'CAST'                    : '登场人物 CAST';
    document.getElementById('story-panel-h').textContent = isEn ? 'STORY PROGRESS'          : '剧情进度 STORY';
    document.getElementById('back-home-link').textContent = isEn ? '← Home'                  : '← 返回首页';
    document.getElementById('lang-toggle').textContent   = isEn ? '中文'                      : 'EN';
    document.getElementById('foot-ep-name').textContent  = isEn ? 'Attack on Pearl Harbor'    : '珍珠港事件';
  }

  /* ============================================================
     Cast — Chinese
     ============================================================ */
  const CAST = {
    "山本五十六":         { avatar: "⚓", title: "日本联合舰队司令长官",       desc: "珍珠港袭击的主要策划者，主张以先发制人重创美国太平洋舰队。" },
    "东条英机":           { avatar: "🎖️", title: "日本首相兼陆军大臣",         desc: "战时内阁核心，最终选择战争路线，为对美开战提供政治背书。" },
    "富兰克林·D·罗斯福":  { avatar: "🦅", title: "美国总统",                    desc: "主导对日制裁与对盟国援助，珍珠港后推动美国正式对日宣战。" },
    "近卫文麿":           { avatar: "📜", title: "前日本首相",                  desc: "在军部压力与国际形势间寻求妥协，未能阻止对美强硬路线。" },
    "川崎清":             { avatar: "📐", title: "日本海军军令部作战部长",      desc: "审议并批准珍珠港作战方案，对山本计划给予关键支持。" }
  };

  /* ============================================================
     Cast — English
     ============================================================ */
  const CAST_EN = {
    "山本五十六": { avatar: "⚓", name: "Yamamoto Isoroku",      title: "Commander-in-Chief, Imperial Japanese Navy",  desc: "Designed the Pearl Harbor strike plan despite personal doubts about war with the U.S., knowing Japan could not win a prolonged conflict." },
    "东条英机":   { avatar: "🎖️", name: "Tojo Hideki",           title: "Prime Minister of Japan",                    desc: "Led Japan into war with the United States, believing there was no alternative after U.S. sanctions cut off Japan's oil supply." },
    "富兰克林·D·罗斯福": { avatar: "🦅", name: "Franklin D. Roosevelt", title: "32nd President of the United States",  desc: "Described December 7 as 'a date which will live in infamy' and led the U.S. into full participation in World War II." },
    "近卫文麿":   { avatar: "📜", name: "Konoe Fumimaro",         title: "Former Prime Minister of Japan",             desc: "Attempted to negotiate a summit with Roosevelt before resigning; his failure paved the way for Tojo and war." },
    "川崎清":     { avatar: "📐", name: "Kawasaki Kiyoshi",       title: "Imperial Japanese Navy Staff Officer",       desc: "A staff planning officer involved in detailed operational coordination for the Pearl Harbor attack." },
    "近卫文麿（前首相，私使）": { avatar: "📜", name: "Konoe Fumimaro (private envoy)", title: "Former Prime Minister of Japan",  desc: "Acting as an unofficial back-channel, he sought a personal summit with Roosevelt to avert war at the last moment." },
    "南云忠一（机动舰队司令）": { avatar: "🚢", name: "Vice Adm. Nagumo Chuichi",      title: "Commander, First Air Fleet",      desc: "Led the carrier strike force that attacked Pearl Harbor; controversially chose not to launch a third wave of strikes." },

  /* ============================================================
     Passages — Chinese (original)
     ============================================================ */
  const PASSAGES = {

    "start": {
      type: "start",
      epEmoji: "🌊",
      epTitle: "珍珠港偷袭",
      epSub: "P E A R L   H A R B O R   ·   D E C   7,   1 9 4 1",
      desc: "1941 年秋，日本与美国的对峙已濒临破裂边缘。美国对日石油禁运冻结日本约 80% 的石油来源；近卫内阁因无法约束军部而倒台，东条英机以陆军大臣身份组阁。山本五十六联合舰队司令在内部酝酿一项前所未有的方案 —— 以航母舰载机奇袭珍珠港，一举瘫痪美国太平洋舰队。当外交、资源、军部、国体等多重压力交织于东京宫廷之时，每一次拍板都将塑造此后整个 20 世纪太平洋的命运。",

    "n2": {
      type: "scene",
      chapter: "第二幕  ·  军令部会议",
      sceneTitle: "奇袭方案的两难",
      progressIndex: 1,
      castOnStage: ["山本五十六", "川崎清", "东条英机"],
      narrative: [
        "11 月 5 日御前会议决定 12 月初对美英开战。山本将「真珠湾攻击作战要领」郑重提交军令部。然军令部内部分歧严重：传统派认为日本海军应于本土近海集中决战，「九段渐减作战」是日本海军三十年传承的战略；山本则坚持必须以航母奇袭一击瘫痪美国太平洋舰队。",

      narrative: [

        "Shokaku and Zuikaku are badly damaged; Kaga is sunk. Japan's mobile strike force is crippled, and the international community unanimously condemns the 'attack on the American mainland' as 'indiscriminate aggression.' Roosevelt uses the incident to invoke the full scope of wartime emergency powers; in June 1942, at Midway, the remnants of Japan's carrier fleet are annihilated. Japan collapses nearly two years ahead of the historical timeline, but faces far harsher postwar punishment than in actual history."
      ],
      reflection: "<b>Counterfactual reasoning:</b> The appeal of an extreme option lies in the illusion of a single decisive reversal. This branch reveals: <b>the failure of strategic overreach is often more complete than the failure of caution — because it squanders both capability and moral standing simultaneously.</b> Yamamoto, as a strategist who understood American society deeply, did not take this path in actual history precisely because of this clear-eyed recognition."
    }
  };

  /* ============================================================
     Story progress labels
     ============================================================ */
  const STORY_PROGRESS_LABELS = [
    "对美谈判破局的阴影",
    "军令部的奇袭抉择",
    "罗斯福的对日方略",
    "联合舰队的最后裁断",
    "袭击之后的全面参战"
  ];

  const STORY_PROGRESS_LABELS_EN = [
    "The Shadow of Collapsed U.S.-Japan Negotiations",
    "The Imperial Navy's Choice to Strike",
    "Roosevelt's Strategy Toward Japan",
    "The Combined Fleet's Final Decision",
    "After the Attack: Full-Scale War"
  ];

  const state = {
    pathTrace: []
  };

  function renderCast(names) {
    const list = document.getElementById("cast-list");
    const cast = getCast();
    list.innerHTML = "";
    (names || []).forEach(key => {
      const c = cast[key];
      if (!c) return;
      const row = document.createElement("div");
      row.className = "cast-row";
      row.innerHTML = `
        <div class="av">${c.avatar}</div>
        <div class="info">
          <div class="name">${currentLang === 'en' ? c.name : key}</div>
          <div class="role">${c.title}</div>
          <div class="desc">${c.desc}</div>
        </div>`;
      list.appendChild(row);
    });
  }

  function renderProgress(currentIndex) {
    const list = document.getElementById("progress-list");
    const labels = getLabels();
    list.innerHTML = "";
    labels.forEach((label, i) => {
      const row = document.createElement("div");
      let cls = "step";
      if (currentIndex != null) {
        if (i < currentIndex) cls += " done";
        else if (i === currentIndex) cls += " current";
      }
      row.className = cls;
      row.innerHTML = `<span class="dot">●</span><span>${i + 1}. ${label}</span>`;
      list.appendChild(row);
    });
    const meta = document.getElementById("meta-progress");
    if (meta) {
      const display = currentIndex == null ? 0 : Math.min(currentIndex + 1, labels.length);
      meta.textContent = currentLang === 'en'
        ? `Act ${display} / ${labels.length}`
        : `第 ${display} / ${labels.length} 幕`;
    }
  }

  function go(passageId, choiceIndex) {
    if (choiceIndex != null) {
      const last = state.pathTrace[state.pathTrace.length - 1];
      if (last && last.choiceIndex == null) last.choiceIndex = choiceIndex;
    }
    render(passageId);
  }

  function render(passageId) {
    currentPassageId = passageId;
    const passages = getPassages();
    const p = passages[passageId];
    if (!p) return;

    const area = document.getElementById("passage-area");
    area.innerHTML = "";

    const card = document.createElement("section");
    card.className = "stage fade-in" + (p.type === "ending" ? " ending" : "") + (p.type === "start" ? " start" : "");

    if (p.type === "start") {
      const startLabel = currentLang === 'en' ? 'Begin this story →' : '开始这段历史 →';
      card.innerHTML = `
        <div class="stage-body">
          <div class="ep-emoji">${p.epEmoji}</div>
          <div class="ep-title">${p.epTitle}</div>
          <div class="ep-sub">${p.epSub}</div>
          <p class="ep-desc">${p.desc}</p>
          <button class="start-btn" id="start-btn">${startLabel}</button>
        </div>`;
      area.appendChild(card);
      renderCast(["山本五十六", "东条英机", "富兰克林·D·罗斯福", "近卫文麿", "川崎清"]);
      renderProgress(null);
      document.getElementById("start-btn").onclick = () => {
        state.pathTrace = [];
        render(p.next);
      };
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (p.type === "scene") {
      state.pathTrace.push({ passageId: passageId, choiceIndex: null });

      const headHtml = `
        <div class="stage-head">
          <div>
            <div class="chapter">${p.chapter}</div>
            <div class="scene-title">${p.sceneTitle}</div>
          </div>
          <div class="right-tag">SCENE  ${String(p.progressIndex + 1).padStart(2, "0")}</div>
        </div>`;

      let bodyHtml = `<div class="stage-body">`;
      p.narrative.forEach((para, i) => {
        bodyHtml += `<p class="narrative${i === 0 ? " lead" : ""}">${para}</p>`;
      });

      if (p.dialogs && p.dialogs.length) {
        bodyHtml += `<div class="dialogs">`;
        p.dialogs.forEach(d => {
          if (d.direction) {
            bodyHtml += `<div class="stage-direction">— ${d.direction} —</div>`;
          } else {
            const av = (CAST[d.who] && CAST[d.who].avatar) || "·";
            const speakerName = currentLang === 'en' ? (CAST_EN[d.who] ? CAST_EN[d.who].name : d.who) : d.who;
            bodyHtml += `<div class="line">
              <div class="who"><span class="av">${av}</span>${speakerName}</div>
              <div class="what">${d.what}</div>
            </div>`;
          }
        });
        bodyHtml += `</div>`;
      }

      if (p.decision) {
        const makerAv = (CAST[p.decision.maker] && CAST[p.decision.maker].avatar) || "·";
        const makerName = currentLang === 'en' ? (CAST_EN[p.decision.maker] ? CAST_EN[p.decision.maker].name : p.decision.maker) : p.decision.maker;
        const decLabel = currentLang === 'en' ? '▼ KEY DECISION' : '▼ 关键抉择 KEY DECISION';
        const makerLabel = currentLang === 'en'
          ? `Decision by ${makerAv} <b>${makerName}</b>`
          : `由 ${makerAv} <b>${makerName}</b> 拍板`;
        bodyHtml += `
          <div class="decision">
            <div class="label">${decLabel}</div>
            <div class="question">${p.decision.question}</div>
            <div class="maker">${makerLabel}</div>
          </div>`;
      }

      if (p.choices && p.choices.length) {
        bodyHtml += `<div class="choices">`;
        p.choices.forEach((c, i) => {
          bodyHtml += `<button class="choice-btn" data-next="${c.next}" data-index="${i}">
            <span class="arrow">▶</span>${c.label}
            ${c.hint ? `<span class="hint">${c.hint}</span>` : ""}
          </button>`;
        });
        bodyHtml += `</div>`;
      }

      bodyHtml += `</div>`;
      card.innerHTML = headHtml + bodyHtml;
      area.appendChild(card);

      renderCast(p.castOnStage);
      renderProgress(p.progressIndex);

      card.querySelectorAll(".choice-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("data-next");
          const idx = parseInt(btn.getAttribute("data-index"), 10);
          go(next, idx);
        });
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (p.type === "ending") {
      const endChapter = currentLang === 'en' ? 'END  ·  THE END' : '终  ·  THE END';
      const headHtml = `
        <div class="stage-head">
          <div>
            <div class="chapter">${endChapter}</div>
            <div class="scene-title">${p.title}</div>
          </div>
          <div class="right-tag">EPISODE COMPLETE</div>
        </div>`;

      let bodyHtml = `<div class="stage-body">
        <div class="ending-tag ${p.tagClass || ""}">${p.tag}</div>
        <div class="ending-title">${p.title}</div>`;

      p.narrative.forEach((para, i) => {
        bodyHtml += `<p class="narrative${i === 0 ? " lead" : ""}">${para}</p>`;
      });

      bodyHtml += `<div class="reflection">${p.reflection}</div>`;

      if (state.pathTrace.length) {
        const ptTitle = currentLang === 'en' ? '▼ YOUR STORY PATH' : '▼ 你走过的剧情线 STORY PATH';
        const endLabel = currentLang === 'en' ? 'Ending reached:' : '抵达结局：';
        bodyHtml += `<div class="path-trace">
          <div class="pt-title">${ptTitle}</div>
          <ol>`;
        state.pathTrace.forEach(t => {
          const tp = passages[t.passageId];
          const sceneName = tp ? tp.sceneTitle : t.passageId;
          let choiceStr = '';
          if (t.choiceIndex != null && tp && tp.choices && tp.choices[t.choiceIndex]) {
            choiceStr = ` — <i style="color:var(--accent-2)">${tp.choices[t.choiceIndex].label}</i>`;
          }
          bodyHtml += `<li>${sceneName}${choiceStr}</li>`;
        });
        bodyHtml += `<li>${endLabel} <b style="color:var(--accent-2)">${p.title}</b></li>`;
        bodyHtml += `</ol></div>`;
      }

      const restartLabel = currentLang === 'en' ? '↺  Restart' : '↺  重新开始（Restart）';
      bodyHtml += `<div class="actions">
        <button id="restart-btn">${restartLabel}</button>
      </div>`;

      bodyHtml += `</div>`;
      card.innerHTML = headHtml + bodyHtml;
      area.appendChild(card);

      renderCast(p.castOnStage);
      renderProgress(getLabels().length - 1);

      document.getElementById("restart-btn").addEventListener("click", () => {
        state.pathTrace = [];
        render("start");
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
  }

  // boot
  updateStaticUI();
  render("start");
</script>
</body>
</html>
